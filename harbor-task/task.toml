[task]
name = "afterquery/ai-sauna-trainer"
description = "Train and evaluate a projectile-based sauna heating agent in Unity."
version = "0.1.0"

[agent]
timeout_sec = 1800

[environment]
build_timeout_sec = 1200
cpus = 4
memory_mb = 8192
storage_mb = 16384

[[environment.mcp_servers]]
name = "sauna"
transport = "streamable-http"
url = "http://sauna-mcp:8000/mcp"

[verifier]
timeout_sec = 900
